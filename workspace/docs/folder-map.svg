<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
  <title id="title">Claude development setup folder map</title>
  <desc id="desc">Two sibling repositories: the team marketplace packages reusable agents, commands, skills, and MCP configuration; the workspace contains project guidance, settings, docs, scripts, and project slots. Agent definitions are files, while subagents and Agent Teams teammates run at runtime.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #4b5872; }
      .repo { font-size: 23px; font-weight: 700; }
      .item { font-size: 17px; font-weight: 650; }
      .desc { font-size: 14px; fill: #43506a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 650; }
      .panel-title { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; fill: #43506a; }
      .badge { font-size: 13px; font-weight: 700; }
      .line { stroke: #a6b1c3; stroke-width: 2; fill: none; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#263451" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1440" height="1160" fill="#f5f7fb"/>
  <text x="64" y="68" class="title">프로젝트 폴더 지도</text>
  <text x="64" y="101" class="subtitle">왼쪽은 재사용 플러그인 저장소, 오른쪽은 실제 작업을 시작하는 워크스페이스입니다.</text>

  <rect x="64" y="135" width="640" height="592" rx="18" fill="#ffffff" stroke="#cad4e3" filter="url(#shadow)"/>
  <rect x="64" y="135" width="640" height="64" rx="18" fill="#e9efff"/>
  <path d="M64 181v18h640v-18" fill="#e9efff"/>
  <text x="92" y="176" class="repo">team-marketplace/</text>
  <text x="92" y="225" class="small">공유할 에이전트와 작업 기능을 패키징하는 저장소</text>

  <path d="M108 257v416M108 257h26M108 305h26M108 353h26M108 401h26M108 449h26M108 497h26M108 545h26M108 593h26M108 641h26" class="line"/>
  <g>
    <rect x="134" y="240" width="536" height="42" rx="9" fill="#f8faff"/>
    <text x="152" y="267" class="mono">.claude-plugin/marketplace.json</text>
    <text x="505" y="267" class="desc">마켓플레이스 목록</text>

    <rect x="134" y="288" width="536" height="42" rx="9" fill="#f8faff"/>
    <text x="152" y="315" class="mono">plugins/dev-team/</text>
    <text x="358" y="315" class="desc">설치 가능한 팀 플러그인</text>

    <rect x="134" y="336" width="536" height="42" rx="9" fill="#fff5e8"/>
    <text x="152" y="363" class="mono">  agents/*.md</text>
    <text x="358" y="363" class="desc">역할 정의 파일 (실행 중 프로세스 아님)</text>

    <rect x="134" y="384" width="536" height="42" rx="9" fill="#f0f9f4"/>
    <text x="152" y="411" class="mono">  commands/*.md</text>
    <text x="358" y="411" class="desc">슬래시 명령 워크플로</text>

    <rect x="134" y="432" width="536" height="42" rx="9" fill="#f0f9f4"/>
    <text x="152" y="459" class="mono">  skills/</text>
    <text x="358" y="459" class="desc">재사용 지침과 템플릿</text>

    <rect x="134" y="480" width="536" height="42" rx="9" fill="#eef8ff"/>
    <text x="152" y="507" class="mono">  .mcp.json</text>
    <text x="358" y="507" class="desc">MCP 서버 연결 설정</text>

    <rect x="134" y="528" width="536" height="42" rx="9" fill="#f8faff"/>
    <text x="152" y="555" class="mono">  .claude-plugin/plugin.json</text>
    <text x="505" y="555" class="desc">플러그인 정보</text>

    <rect x="134" y="576" width="536" height="42" rx="9" fill="#ffffff"/>
    <text x="152" y="603" class="mono">README.md</text>
    <text x="358" y="603" class="desc">설치·연동 안내</text>

    <rect x="134" y="624" width="536" height="42" rx="9" fill="#eef8ff"/>
    <text x="152" y="651" class="mono">MCP 서버 프로그램</text>
    <text x="358" y="651" class="desc">이 저장소에 들어 있지 않음</text>
  </g>

  <rect x="736" y="135" width="640" height="592" rx="18" fill="#ffffff" stroke="#cad4e3" filter="url(#shadow)"/>
  <rect x="736" y="135" width="640" height="64" rx="18" fill="#e6f6ee"/>
  <path d="M736 181v18h640v-18" fill="#e6f6ee"/>
  <text x="764" y="176" class="repo">workspace/</text>
  <text x="764" y="225" class="small">Claude Code를 실행하고 프로젝트 작업을 맡기는 곳</text>

  <path d="M780 257v416M780 257h26M780 305h26M780 353h26M780 401h26M780 449h26M780 497h26M780 545h26M780 593h26M780 641h26" class="line"/>
  <g>
    <rect x="806" y="240" width="536" height="42" rx="9" fill="#f4fbf7"/>
    <text x="824" y="267" class="mono">CLAUDE.md</text>
    <text x="1030" y="267" class="desc">세션 공통 규칙과 프로젝트 안내</text>

    <rect x="806" y="288" width="536" height="42" rx="9" fill="#f4fbf7"/>
    <text x="824" y="315" class="mono">.claude/settings.json</text>
    <text x="1090" y="315" class="desc">설정과 플러그인 활성화</text>

    <rect x="806" y="336" width="536" height="42" rx="9" fill="#f4fbf7"/>
    <text x="824" y="363" class="mono">.claude/rules/*.md</text>
    <text x="1090" y="363" class="desc">기술·프로젝트별 가이드</text>

    <rect x="806" y="384" width="536" height="42" rx="9" fill="#f8faff"/>
    <text x="824" y="411" class="mono">docs/</text>
    <text x="1030" y="411" class="desc">설정·구조·사용법 문서</text>

    <rect x="806" y="432" width="536" height="42" rx="9" fill="#f8faff"/>
    <text x="824" y="459" class="mono">scripts/</text>
    <text x="1030" y="459" class="desc">tmux 팀 세션 시작 도우미</text>

    <rect x="806" y="480" width="536" height="42" rx="9" fill="#f7f1ff"/>
    <text x="824" y="507" class="mono">project-1/ ... project-3/</text>
    <text x="1090" y="507" class="desc">저장소 추가 자리 (현재 빈 폴더)</text>

    <rect x="806" y="528" width="536" height="42" rx="9" fill="#f8faff"/>
    <text x="824" y="555" class="mono">.gitkeep</text>
    <text x="1030" y="555" class="desc">빈 프로젝트 폴더를 Git에 보존</text>

    <rect x="806" y="576" width="536" height="42" rx="9" fill="#ffffff"/>
    <text x="824" y="603" class="mono">팀원 실행 세션</text>
    <text x="1030" y="603" class="desc">요청이 있을 때 실행됨</text>

    <rect x="806" y="624" width="536" height="42" rx="9" fill="#ffffff"/>
    <text x="824" y="651" class="mono">프로젝트 저장소</text>
    <text x="1030" y="651" class="desc">아직 이 폴더들에 추가되지 않음</text>
  </g>

  <rect x="64" y="755" width="1312" height="330" rx="18" fill="#ffffff" stroke="#cad4e3" filter="url(#shadow)"/>
  <text x="96" y="799" class="panel-title">에이전트 파일과 실행 중인 에이전트는 달라요</text>
  <text x="96" y="832" class="small">위쪽 agents/*.md 파일은 재사용할 역할의 설계도입니다. 실제 작업자는 세션 중 생성되며 별도 폴더로 저장되지 않습니다.</text>

  <rect x="96" y="864" width="575" height="166" rx="14" fill="#fff7eb" stroke="#efc98a"/>
  <rect x="120" y="882" width="130" height="26" rx="13" fill="#f4d9ad"/>
  <text x="139" y="900" class="badge">Subagent</text>
  <text x="120" y="938" class="item">한 세션 안의 집중 작업자</text>
  <text x="120" y="970" class="small">자체 문맥에서 조사·작업 후 요약을 메인 세션에 반환</text>
  <text x="120" y="1001" class="small">대개 별도 tmux 창으로 보이지 않음</text>

  <rect x="697" y="864" width="647" height="166" rx="14" fill="#eef8ff" stroke="#a8cce9"/>
  <rect x="721" y="882" width="194" height="26" rx="13" fill="#cce7fa"/>
  <text x="740" y="900" class="badge">Agent Teams teammate</text>
  <text x="721" y="938" class="item">tmux에서 볼 수 있는 별도 세션 동료</text>
  <text x="721" y="970" class="small">팀 작업 목록과 서로 메시지를 주고받으며 병렬 작업</text>
  <text x="721" y="1001" class="small">현재 설정: launch-team.sh + teammateMode=tmux</text>

  <text x="96" y="1058" class="desc">MCP는 서비스 연결 규격입니다. .mcp.json은 연결 정보를 적고, 실제 Atlassian·Dynatrace 서버 프로그램은 별도로 실행됩니다.</text>
</svg>
